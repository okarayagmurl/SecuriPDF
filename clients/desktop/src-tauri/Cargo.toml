[package]
name = "securipdf-desktop"
version = "1.2.69"
description = "SecuriPDF for Windows. Runs PDF tools on the user's machine without a server."
authors = ["Entera"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lopdf = "0.34"
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
qrcode = { version = "0.14", default-features = false }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-single-instance = "2.4.1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[lints.rust]
warnings = "deny"
